<!doctype html><html lang="th"><meta charset="utf-8"><title>Artist — Animation Preview</title>
<style>body{font:16px system-ui;background:#f6f5f2;color:#253046;margin:32px}h1{font-size:24px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:8px 16px;border:1px solid #cdd2df;border-radius:10px;background:white;cursor:pointer}#quote{padding:12px 18px;background:white;border-radius:14px;display:inline-block;max-width:500px;overflow-wrap:anywhere;white-space:normal;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:white;border:1px solid #e1e3e9;border-radius:16px;padding:12px;text-align:center}.stage{width:200px;height:250px;margin:auto;background:repeating-conic-gradient(#e2e5eb 0% 25%,#eff1f5 0% 50%) 0 / 24px 24px}.stage img{width:200px;height:250px;display:block}.mirror .directional{transform:scaleX(-1)}small{color:#667085}</style>
<h1>Artist · ตัวละครผู้ชาย</h1><p>ชุดภาพต้นแบบสำหรับ Change Model — 12 ท่า / 96 เฟรม · ภาพโปร่งใส</p>
<div class="controls"><button id="pause">Pause</button><button id="mirror">กลับทิศเดิน / วิ่ง / ปีน</button><button id="say">Say</button></div><div id="quote"></div><div class="grid" id="grid"></div>
<script>const states=[{"id": "idle", "folder": "01_idle", "fps": 2.5, "loop": true, "action": "A calm standing IDLE breathing and blinking LOOP facing gently three-quarter toward viewer. Hands relaxed at sides. Frames 1-3 slowly inhale with only tiny torso rise; frame 4 eyelids close; frame 5 eyes reopen; frames 6-8 exhale back into frame 1. Tiny movement, fixed foot ground and nearly fixed head, no gestures."}, {"id": "walk", "folder": "02_walk", "fps": 5, "loop": true, "action": "A gentle WALK cycle traveling LEFT, character nose and body clearly face LEFT in all eight frames. Complete one coherent eight-phase gait: 1 left leading contact, 2 downward weight transfer, 3 right leg passing under body, 4 rise with right leg swinging forward, 5 right leading contact, 6 downward weight transfer, 7 left passing under body, 8 rise with left swinging forward into frame 1. Feet and arms alternate smoothly and opposite each other; small steps and slight head bob. Never change facing. Both rows belong to one cycle. SAME LARGE HEAD AND BODY SCALE as reference."}, {"id": "run", "folder": "03_run", "fps": 7, "loop": true, "action": "A cute controlled RUN cycle traveling LEFT; every nose faces LEFT, slight consistent forward torso lean. One coherent eight-phase gait: 1 left foot contacts ahead, 2 left stance compresses, 3 left toe pushes with right knee forward, 4 short airborne passing phase, 5 right foot contacts ahead, 6 right stance compresses, 7 right toe pushes with left knee forward, 8 short airborne passing phase returning to frame 1. Bent arms alternate opposite legs. No legs swapping ownership or facing backwards; no wild splits or kicking. Moderate restrained stride. Keep large head and overall scale EXACTLY same as idle and walk, do not shrink character to fit run."}, {"id": "jump", "folder": "04_jump", "fps": 10, "loop": false, "action": "One eight-frame JUMP action, same three-quarter facing throughout. 1 neutral ready; 2 knees bend anticipation; 3 push off and straighten; 4 tuck knees in ascent; 5 apex with cute happy expression and hands slightly raised; 6 legs extend preparing landing; 7 soft bent-knee landing; 8 return to neutral. Constant head size. Let app physics move character; depict body posture, no extreme vertical displacement within cells."}, {"id": "fall", "folder": "05_fall", "fps": 4, "loop": true, "action": "A gentle falling-through-air LOOP, fixed three-quarter facing. Short legs dangling and bent slightly, hands raised out to sides, mildly surprised cute face. Hair fringe and loose tie drift upward slightly. Eight subtly changing intermediate poses, slight arm balance oscillation, no panic or tears, no landing pose, no actual floor."}, {"id": "sit", "folder": "06_sit", "fps": 2.5, "loop": true, "action": "A seated relaxed breathing-and-blinking LOOP, facing three-quarter toward viewer. Seated bottom supported on invisible ground, knees tucked forward comfortably, hands resting on knees. Same large head size and same body scale as reference, natural lower total pose height. Eight subtle breathing frames, one blink near frame 4, no standing up, no chair."}, {"id": "sleep", "folder": "08_sleep", "fps": 1.5, "loop": true, "action": "A curled-up sleeping LOOP lying sideways, head toward LEFT, knees tucked, hands together under cheek. Closed eyes, peaceful little smile. Keep actual head SIZE same as reference; pose is lower and wider, do not shrink whole body. Eight gentle slow breathing phases with tiny torso rise and hair movement, last connects to first. No pillow, blanket, Z letters, floating symbols, floor shadow."}, {"id": "climb", "folder": "09_climb_hang", "fps": 4.5, "loop": true, "action": "A CLIMB UP AN INVISIBLE VERTICAL WINDOW EDGE cycle. Character faces LEFT in all eight cells, arms reach toward the LEFT side and hands grip an imaginary vertical edge just left of the body; no edge or wall drawn. Eight coherent alternating climbing phases: left hand reaches upward, grips and pulls with right knee lifting, right hand reaches upward, grips and pulls with left knee lifting, repeat with smooth intermediates. Short limbs, relaxed determined cute face, hands and feet visible. No horizontal walking, no ladder, no hanging by hair."}, {"id": "wave", "folder": "10_wave", "fps": 4, "loop": true, "action": "A friendly waving LOOP facing three-quarter toward viewer, feet planted. One hand raised beside face with palm outward, the other relaxed. Eight smooth intermediate wrist wave poses moving gently left-to-right then returning, head size unchanged and only tiny torso sway; friendly smile, no extra fingers.", "playbackOrder": [0, 1, 6, 7, 6, 1, 0, 1]}, {"id": "happy", "folder": "14_happy", "fps": 4, "loop": true, "action": "A cute happy celebratory LOOP facing viewer. Feet mostly grounded, tiny bounce only; short arms make small excited movements close to body and rosy smiling face. Eight connected subtle phases: tiny anticipation, lift fists beside cheeks, little happy bounce, settle and repeat. No props, no floating hearts or sparkles, no mouth huge open, constant head and body scale."}, {"id": "drag", "folder": "18_interactions", "fps": 4, "loop": true, "action": "A gently dangling picked-up-by-mouse LOOP facing viewer. Imagine held at torso without drawing mouse or hand; feet hang free, arms lightly stretch outward for balance, little surprised but friendly expression. Eight connected subtle swaying poses left-to-right with dangling knees, constant head size, no distortion, no grabbing external hand or cursor."}, {"id": "talk", "folder": "19_talk", "fps": 4, "loop": true, "action": "A gentle friendly TALKING LOOP facing three-quarter toward viewer, feet planted and hands near body. Eight connected small mouth poses closed smile, slightly open, rounded, small open smile, closed, slightly open, small open, return closed; tiny eyebrow and one hand movement. Character is male. No actual words, text, speech bubbles or floating symbols; dialogue is displayed separately by the app."}],quotes=["ซัวว์ครับ ผมอยู่ตรงนี้นะ", "วันนี้เหนื่อยไหมครับ พักด้วยกันสักนิดนะ", "ผมเป็นกำลังใจให้ซัวว์นะครับ", "ค่อย ๆ ทำทีละอย่างก็ได้ครับ ไม่ต้องรีบ", "ดื่มน้ำสักหน่อยนะครับ ผมเป็นห่วง", "วันนี้ซัวว์พยายามมากแล้วครับ", "ยิ้มให้ผมหน่อยได้ไหมครับ", "วันไหนไม่ไหว มานั่งพักข้างผมก็ได้นะ", "ขอบคุณที่ให้ผมมาอยู่เป็นเพื่อนนะครับ", "ผมขออยู่ข้าง ๆ ตอนซัวว์ทำงานนะครับ", "พักสายตาหน่อยนะครับ แล้วค่อยไปต่อด้วยกัน", "ผมไม่ได้ไปไหนครับ ยังอยู่เป็นเพื่อนตรงนี้", "ทำได้ทีละนิดก็เก่งแล้วครับ", "คืนนี้นอนให้พอนะครับ พรุ่งนี้ค่อยเริ่มใหม่"];let paused=false,elapsed=0,last=performance.now(),quoteIndex=-1;
for(const s of states){const card=document.createElement('div');card.className='card';card.innerHTML=`<strong>${s.id}</strong><div class="stage"><img alt="${s.id}" class="${['walk','run','climb'].includes(s.id)?'directional':''}" src="../macOS-source/ShimejiNook/Assets/Models/artist-male-v1/Assets/${s.folder}/frame_01.png"></div><small>${s.fps} fps · 8 frames</small>`;document.querySelector('#grid').append(card);s.img=card.querySelector('img');s.frames=Array.from({length:8},(_,i)=>{const im=new Image;im.src=`../macOS-source/ShimejiNook/Assets/Models/artist-male-v1/Assets/${s.folder}/frame_${String(i+1).padStart(2,'0')}.png`;return im;});}
function animate(now){const dt=Math.min((now-last)/1000,.1);last=now;if(!paused)elapsed+=dt;for(const s of states){const phase=Math.floor(elapsed*s.fps)%8;const f=(s.playbackOrder||[0,1,2,3,4,5,6,7])[phase];s.img.src=s.frames[f].src;}requestAnimationFrame(animate);}requestAnimationFrame(animate);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};document.querySelector('#mirror').onclick=()=>document.body.classList.toggle('mirror');document.querySelector('#say').onclick=()=>{let i;do{i=Math.floor(Math.random()*quotes.length)}while(i===quoteIndex);quoteIndex=i;document.querySelector('#quote').textContent=quotes[i];};document.querySelector('#say').click();</script></html>
